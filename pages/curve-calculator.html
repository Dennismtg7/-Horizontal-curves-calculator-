<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horizontal Curve Calculator — SurveyPro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Space Grotesk',sans-serif;background:#0a0f1e;min-height:100vh;display:flex;flex-direction:column}
    .tool-header{display:flex;align-items:center;gap:16px;padding:12px 24px;
      background:#0b1f3a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
    .back-btn{background:rgba(255,255,255,.1);color:#fff;border:none;padding:7px 16px;
      border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
    .back-btn:hover{background:rgba(255,255,255,.18)}
    .tool-title{color:#00bfb3;font-size:15px;font-weight:700}
    .tool-frame{width:100%;flex:1;border:none;background:#fff}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="tool-header">
    <a class="back-btn" href="../index.html">← Back</a>
    <span class="tool-title">⌒ Horizontal Curve Calculator</span>
  </div>
  <!--
    Place your curve_calculator.html in this folder as curve-calculator-tool.html
    then replace below with:
    <iframe class="tool-frame" src="curve-calculator-tool.html" title="Horizontal Curve Calculator"></iframe>
  -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px">
    <div>
      <div style="font-size:52px;margin-bottom:20px">⌒</div>
      <h2 style="color:#00bfb3;margin-bottom:12px;font-size:22px">Horizontal Curve Calculator</h2>
      <p style="color:rgba(255,255,255,.6);max-width:420px;line-height:1.7">
        Add your <code style="background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px">curve_calculator.html</code>
        file as <code style="background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px">curve-calculator-tool.html</code>
        in the <code style="background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px">pages/</code> folder.
      </p>
    </div>
  </div>
</body>
</html>
